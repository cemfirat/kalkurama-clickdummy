<progress class="uk-progress" value="62" max="100"></progress>

<div class="uk-flex uk-flex-middle uk-flex-wrap uk-grid-small" data-uk-grid>
  <div><span data-uk-spinner="ratio: .8" aria-label="Lädt"></span></div>
  <div><button class="uk-button uk-button-default" type="button" data-uk-toggle="target: #styleguide-modal">Modal öffnen</button></div>
</div>

<div id="styleguide-modal" class="uk-modal" data-uk-modal>
  <div class="uk-modal-dialog">
    <button class="uk-modal-close-default" type="button" data-uk-close aria-label="Schließen"></button>
    <div class="uk-modal-header">
      <h3 class="uk-modal-title">Neue Position</h3>
    </div>
    <div class="uk-modal-body">
      <p>Kalkurama verwendet Modals für kompakte, kontextgebundene Aktionen, wenn ein Seitenwechsel unnötig wäre.</p>
    </div>
    <div class="uk-modal-footer uk-flex uk-flex-right">
      <button class="uk-button uk-button-default uk-modal-close" type="button">Abbrechen</button>
      <button class="uk-button uk-button-primary uk-modal-close" type="button">Speichern</button>
    </div>
  </div>
</div>
