<div id="project-edit-modal" class="uk-modal" data-uk-modal>
  <div class="uk-modal-dialog uk-modal-body">
    <button class="uk-modal-close-default" type="button" data-uk-close aria-label="Schließen"></button>

    <div class="uk-text-meta">Projekt · Atelier Morgen</div>
    <h2 class="uk-modal-title">Projekt bearbeiten</h2>

    <form class="uk-form-stacked">
      <div class="uk-margin">
        <label class="uk-form-label" for="project-name">Projektname</label>
        <input id="project-name" class="uk-input" maxlength="180" required value="Brand Refresh">
        <div class="uk-text-meta uk-margin-small-top">
          Umbenennen ändert nur die aktuelle Projektbezeichnung. Bereits ausgestellte Dokument-Snapshots und die kommerzielle Historie bleiben unverändert.
        </div>
      </div>

      <div class="uk-flex uk-flex-between uk-flex-middle">
        <button class="uk-button uk-button-text uk-modal-close" type="button">Abbrechen</button>
        <button class="uk-button uk-button-primary uk-modal-close" type="button">Projekt speichern</button>
      </div>
    </form>
  </div>
</div>
