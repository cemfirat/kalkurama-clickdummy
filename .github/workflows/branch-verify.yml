name: Branch Verify

on:
  push:
    branches:
      - "verify/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kalkurama-clickdummy-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static checks and build
        run: npm run verify

      - name: Report pending UI transfer delta
        run: npm run transfer:status
