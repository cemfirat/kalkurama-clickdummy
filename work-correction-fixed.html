<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixposition korrigieren · Kalkurama</title>
  <link rel="icon" href="/src/themes/kalkurama/images/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/src/themes/kalkurama/images/favicon.ico" sizes="any">
</head>
<body data-page="work">
  <div class="kalkurama-shell kalkurama-shell--app">
    <!-- @include partials/header.html -->
    <div class="kalkurama-body kalkurama-body--with-sidebar">
      <!-- @include partials/sidebar.html -->
      <main class="kalkurama-main" id="main-content">
        <div class="uk-width-1-1 uk-width-2-3@l">
          <div class="uk-text-meta">Historische Korrektur</div>
          <h1>Fixposition korrigieren</h1>

          <div class="uk-alert-primary" uk-alert>
            <p>Nur unverrechnete Arbeit kann korrigiert werden. Die Währung bleibt unverändert. Frühere kommerzielle Werte bleiben in der Audit-Historie erhalten.</p>
          </div>
          <form class="uk-card uk-card-default uk-card-body uk-form-stacked" data-work-correct>
            <div class="uk-margin"><div class="uk-text-meta">Projekt</div><strong>Atelier Morgen · Website Relaunch</strong></div>
            <div class="uk-margin"><label class="uk-form-label" for="description">Beschreibung</label><input class="uk-input" id="description" required value="Responsive Prototyp"></div>
            <div class="uk-margin"><label class="uk-form-label" for="occurred_on">Arbeitsdatum</label><input class="uk-input" type="date" id="occurred_on" required value="2026-10-06"></div>
            <div class="uk-margin"><label class="uk-form-label" for="amount">Betrag (EUR)</label><input class="uk-input" id="amount" inputmode="decimal" required value="420.00"></div>
            <div class="uk-margin"><label class="uk-form-label" for="reason">Korrekturgrund</label><textarea class="uk-textarea" id="reason" rows="3" maxlength="1000" required>Finalen Leistungsumfang übernommen.</textarea></div>
          <div class="uk-flex uk-flex-between uk-flex-middle">
            <a href="./work.html">Abbrechen</a>
            <button class="uk-button uk-button-primary" type="button">Korrektur speichern</button>
          </div>
        </form>
        </div>
      </main>
    </div>
    <!-- @include partials/mobile-sidebar.html -->
  </div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
